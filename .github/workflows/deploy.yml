name: Deploy Backend

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Deploy to EC2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ssh -o StrictHostKeyChecking=no \
            ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} << EOF
            set -e

            # Clone if directory doesn't exist, otherwise pull
            if [ ! -d ~/Flights-Service ]; then
              git clone https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git ~/Flights-Service
            fi

            cd ~/Flights-Service

            # Authenticated pull (works for both public and private repositories)
            git pull https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git main

            docker compose down

            docker compose up -d --build

            docker image prune -f
          EOF

